name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: azizdridi248
  API_IMAGE_NAME: devops-api
  WORKER_IMAGE_NAME: devops-worker

jobs:
  # ============================================
  # Stage 1-3: Test both services
  # ============================================
  test:
    name: Test Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    
    steps:
      # Stage 1: Code Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stage 2: Install Dependencies
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Stage 3: Run Tests
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          PYTHONPATH=. pytest tests/ -v --tb=short

  # ============================================
  # Stage 4: SAST Security Scan (Bandit)
  # ============================================
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r services/api/src/ services/worker/src/ -f json -o bandit-report.json || true
          bandit -r services/api/src/ services/worker/src/ -f txt || true
        continue-on-error: true

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ============================================
  # Stage 5: Build Docker Images
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, sast]
    strategy:
      matrix:
        include:
          - service: api
            image: devops-api
            port: 8000
          - service: worker
            image: devops-worker
            port: 8001
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Stage 6: Push Docker Images (Docker Hub)
  # ============================================
  push:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api
            image: devops-api
          - service: worker
            image: devops-worker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:latest

  # ============================================
  # Stage 7: Deployment Ready (Local Minikube)
  # ============================================
  # NOTE: GitHub Actions cannot deploy to local Minikube (no network path).
  # This stage prepares deployment artifacts and outputs instructions for manual deployment.
  deploy-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment manifests
        run: |
          sed -i "s|image: .*devops-api.*|image: ${{ env.DOCKER_USERNAME }}/devops-api:${{ github.sha }}|g" k8s/api-deployment.yaml
          sed -i "s|image: .*devops-worker.*|image: ${{ env.DOCKER_USERNAME }}/devops-worker:${{ github.sha }}|g" k8s/worker-deployment.yaml

      - name: Upload deployment manifests
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: k8s/

      - name: Output deployment instructions
        run: |
          echo "============================================"
          echo "🚀 DEPLOYMENT READY"
          echo "============================================"
          echo ""
          echo "Docker images pushed to Docker Hub:"
          echo "  - ${{ env.DOCKER_USERNAME }}/devops-api:${{ github.sha }}"
          echo "  - ${{ env.DOCKER_USERNAME }}/devops-worker:${{ github.sha }}"
          echo ""
          echo "To deploy to your local Minikube:"
          echo "  1. Download the 'k8s-manifests' artifact from this run"
          echo "  2. Or run these commands locally:"
          echo ""
          echo "     # Update image tags"
          echo "     sed -i 's|image: .*devops-api.*|image: ${{ env.DOCKER_USERNAME }}/devops-api:${{ github.sha }}|g' k8s/api-deployment.yaml"
          echo "     sed -i 's|image: .*devops-worker.*|image: ${{ env.DOCKER_USERNAME }}/devops-worker:${{ github.sha }}|g' k8s/worker-deployment.yaml"
          echo ""
          echo "     # Deploy to Minikube"
          echo "     kubectl apply -f k8s/"
          echo "     kubectl rollout status deployment/devops-api"
          echo "     kubectl rollout status deployment/devops-worker"
          echo ""
          echo "============================================"

  # ============================================
  # DAST: OWASP ZAP Baseline Scan
  # ============================================
  dast:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose up -d --build
          sleep 15  # Wait for services to be ready

      - name: Run OWASP ZAP Baseline Scan on API
        run: |
          chmod 777 $(pwd)
          docker run -v $(pwd):/zap/wrk/:rw --network="host" -w /zap/wrk -t ghcr.io/zaproxy/zaproxy:stable /zap/zap-baseline.py -t http://localhost:8000 -r report_html.html -c .zap/rules.tsv -I || true
        continue-on-error: true

      - name: Stop services
        run: docker compose down

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
